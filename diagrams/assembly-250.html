<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>250 mm L-Column Rig — Full Assembly</title>
<style>
  :root{
    --bg:#0E2238; --panel:#132C47; --ink:#D9E8FA; --dim:#7FA3C7; --grid:#1B3A5C;
    --amber:#FFB454; --red:#E5484D; --teal:#4FD6C0; --viol:#B49CFF; --ok:#7BE39A;
    --khaki:#B9B48A; --rose:#FF7B9C;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:36px 36px}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 70px}
  header{border:2px solid var(--ink);background:var(--panel);padding:14px 20px;margin-bottom:18px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  h1{font-size:clamp(20px,3.2vw,26px);font-weight:normal;margin-top:3px}
  header p{color:var(--dim);margin-top:5px;font-size:14px}
  .panel{background:var(--panel);border:1.5px solid var(--ink);margin-bottom:18px}
  .phead{display:flex;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding:8px 14px}
  .phead h2{font-size:15px;font-weight:normal}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.13em}
  svg{display:block;width:100%;height:auto;background:var(--bg)}
  text{font-family:'Courier New',monospace}
  .cap{padding:10px 16px;color:var(--dim);font-size:13.5px;border-top:1px dashed var(--dim)}
  .cap b{color:var(--ink);font-weight:normal;border-bottom:1px dotted var(--amber)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">Assembly · FINAL CONFIG · 250 mm L-Columns · Twins Series Stack · Scale 2.0 px/mm</div>
  <h1>The whole machine — every part now cut or owned</h1>
  <p>Front view at rest. Predicted: m₁ ≈ 310 g → f ≈ 3.75 Hz → sag ≈ 18 mm. First pluck tests this.</p>
</header>

<section class="panel">
  <div class="phead"><h2>Front view — at rest</h2><div class="tag">±15 TRAVEL · MARGIN BANKED ABOVE</div></div>
  <!-- scale 2.0 px/mm; ground y=560; top of columns y=560-500=60 -->
  <svg viewBox="0 0 970 650">
  <g transform="translate(160,30)">
    <!-- base plate -->
    <rect x="-60" y="530" width="700" height="16" fill="#132C47" stroke="var(--rose)" stroke-width="2.5"/>
    <text x="500" y="565" fill="var(--rose)" font-size="13">base plate + L-sockets</text>
    <g stroke="var(--dim)" stroke-width="1">
      <line x1="-40" y1="550" x2="-52" y2="560"/><line x1="40" y1="550" x2="28" y2="560"/>
      <line x1="620" y1="550" x2="608" y2="560"/>
    </g>

    <!-- L-columns (front view: left & right verticals, 250 tall => 500px, from y=30 to 530) -->
    <rect x="0"   y="30" width="40" height="500" fill="#132C47" stroke="var(--khaki)" stroke-width="2.5"/>
    <rect x="540" y="30" width="40" height="500" fill="#132C47" stroke="var(--khaki)" stroke-width="2.5"/>
    <text x="-8" y="20" fill="var(--khaki)" font-size="13">L-column (Jonathan's) · 250 tall</text>

    <!-- top tie -->
    <rect x="0" y="30" width="580" height="22" fill="#132C47" stroke="var(--khaki)" stroke-width="2.5"/>
    <text x="230" y="46" fill="var(--khaki)" font-size="12">top tie — structure only now</text>

    <!-- margin zone (error budget) -->
    <rect x="42" y="55" width="496" height="105" fill="rgba(123,227,154,.08)" stroke="var(--ok)" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="180" y="112" fill="var(--ok)" font-size="13">≈54 mm error budget / future travel</text>

    <!-- ===== stack (reusing 196 layout, shifted down by margin) =====
      ground 530; fork slider now a plain rectangle resting on ground (y 368-530)
      ToF 5->10 y=358 ; gap 55->110 body underside y=248
      body 15->30 top y=218; travel band 15->30 up to y=188 (+clearance)
    -->

    <!-- fork slider: same size as body slider, resting on the ground -->
    <rect x="80" y="500" width="420" height="30" fill="rgba(229,72,77,.15)" stroke="var(--red)" stroke-width="2.5"/>
    <text x="100" y="520" fill="var(--red)" font-size="13">fork slider 128.8 · rests on ground</text>
    <rect x="40" y="487" width="9" height="60" fill="var(--red)"/>
    <rect x="531" y="487" width="9" height="60" fill="var(--red)"/>
    <!-- ToF -->
    <rect x="378" y="488" width="44" height="12" fill="var(--teal)"/>
    <line x1="400" y1="488" x2="400" y2="248" stroke="var(--teal)" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="412" y="380" fill="var(--teal)" font-size="12">ToF gap to body underside</text>

    <!-- k1 SERIES STACK beside beam: post, spring1, coupler, spring2 -->
    <line x1="290" y1="500" x2="290" y2="258" stroke="var(--dim)" stroke-width="5"/>
    <path d="M290,500 l0,-14 l12,-12 l-24,-14 l24,-14 l-24,-14 l24,-14 l-12,-12 l0,-8"
      stroke="var(--ink)" stroke-width="2.2" fill="none"/>
    <rect x="276" y="382" width="28" height="8" fill="var(--khaki)" stroke="var(--ink)" stroke-width="1.2"/>
    <path d="M290,382 l0,-8 l12,-12 l-24,-14 l24,-14 l-24,-14 l24,-14 l-12,-12 l0,-38"
      stroke="var(--ink)" stroke-width="2.2" fill="none"/>
    <text x="86" y="360" fill="var(--dim)" font-size="12">k₁ = 2× 40mm @343 in SERIES</text>
    <text x="86" y="376" fill="var(--khaki)" font-size="12">coupler disc on 55mm post</text>
    <text x="86" y="392" fill="var(--dim)" font-size="12">net 172 N/m · f≈3.4Hz</text>

    <!-- body slider -->
    <rect x="80" y="218" width="420" height="30" fill="rgba(255,180,84,.15)" stroke="var(--amber)" stroke-width="2.5"/>
    <text x="132" y="238" fill="var(--amber)" font-size="13">body slider 128.8 · 4 quarter wells + IMU</text>
    <!-- travel stop tab on left column at +13mm above body top -->
    <rect x="40" y="196" width="26" height="7" fill="#132C47" stroke="var(--rose)" stroke-width="2"/>
    <text x="70" y="200" fill="var(--rose)" font-size="11">stop tab (+13 limit)</text>
    <rect x="40" y="205" width="9" height="60" fill="var(--amber)"/>
    <rect x="531" y="205" width="9" height="60" fill="var(--amber)"/>
    <rect x="255" y="248" width="70" height="5" fill="#EDEDED"/>
    <rect x="120" y="206" width="32" height="12" fill="var(--viol)"/>
    <text x="118" y="200" fill="var(--viol)" font-size="12">IMU</text>
    <!-- travel band -->
    <rect x="66" y="188" width="8" height="90" fill="rgba(123,227,154,.5)"/>
    <text x="80" y="184" fill="var(--ok)" font-size="12">±13 travel</text>

    <!-- ===== SERVO COLUMN CLAMP (right column, just above body) ===== -->
    <!-- clamp block wrapping the column -->
    <rect x="530" y="140" width="60" height="46" fill="#132C47" stroke="var(--ok)" stroke-width="2.5"/>
    <circle cx="584" cy="163" r="5" fill="none" stroke="var(--ok)" stroke-width="2"/>
    <text x="598" y="150" fill="var(--ok)" font-size="12">printed clamp</text>
    <text x="598" y="166" fill="var(--dim)" font-size="11">M4 pinch bolt →</text>
    <text x="598" y="182" fill="var(--dim)" font-size="11">slides to tune height</text>
    <!-- servo body hanging inboard -->
    <rect x="466" y="148" width="62" height="30" fill="#1b4a3a" stroke="var(--ok)" stroke-width="2"/>
    <text x="476" y="168" fill="var(--ok)" font-size="12">MG90S</text>
    <!-- 10mm arm angled down-inboard -->
    <line x1="470" y1="178" x2="452" y2="192" stroke="var(--ok)" stroke-width="3.5"/>
    <circle cx="470" cy="178" r="4" fill="var(--ok)"/>
    <text x="404" y="180" fill="var(--dim)" font-size="11">10mm arm</text>
    <!-- series spring from arm tip down to body tab -->
    <path d="M452,192 l6,5 l-12,6 l12,6 l-12,6 l12,6 l-12,6 l6,5"
      stroke="var(--ok)" stroke-width="2.2" fill="none"/>
    <text x="464" y="215" fill="var(--ok)" font-size="11">series 196 N/m (reassigned)</text>
    <text x="464" y="229" fill="var(--dim)" font-size="11">preload 3-4mm</text>
    <!-- body tab receiving -->
    <rect x="436" y="232" width="34" height="7" fill="var(--amber)" stroke="var(--ink)" stroke-width="1"/>
    <text x="366" y="243" fill="var(--amber)" font-size="11">tab</text>
    <!-- force arrow -->
    <path d="M453,246 l0,16 m-6,-7 l6,7 l6,-7" stroke="var(--ok)" stroke-width="2" fill="none"/>
    <text x="466" y="258" fill="var(--ok)" font-size="12">u(t)</text>

    <!-- ESP32 wiring hint -->
    <rect x="640" y="330" width="80" height="40" fill="#1a3a2a" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="656" y="354" fill="var(--ink)" font-size="12">ESP32</text>
    <g stroke="var(--ok)" stroke-width="1.3" fill="none" stroke-dasharray="2 3">
      <path d="M640,340 C600,300 600,200 528,163"/>
      <path d="M640,350 C580,400 500,470 422,492"/>
      <path d="M640,360 C560,380 300,300 152,212"/>
    </g>
    <text x="634" y="390" fill="var(--ok)" font-size="11">PWM · I2C bus</text>

    <!-- right budget column -->
    <g transform="translate(760,30)" font-size="12.5">
      <line x1="0" y1="0" x2="0" y2="500" stroke="var(--dim)" stroke-width="1"/>
      <g stroke="var(--dim)">
        <line x1="-6" y1="0" x2="6" y2="0"/><line x1="-6" y1="25" x2="6" y2="25"/>
        <line x1="-6" y1="130" x2="6" y2="130"/><line x1="-6" y1="188" x2="6" y2="188"/>
        <line x1="-6" y1="218" x2="6" y2="218"/><line x1="-6" y1="248" x2="6" y2="248"/>
        <line x1="-6" y1="470" x2="6" y2="470"/>
        <line x1="-6" y1="500" x2="6" y2="500"/>
      </g>
      <text x="12" y="16" fill="var(--khaki)">tie 11</text>
      <text x="12" y="85" fill="var(--ok)">margin ≈54</text>
      <text x="12" y="165" fill="var(--ok)">travel+clr 23</text>
      <text x="12" y="236" fill="var(--amber)">body 15</text>
      <text x="12" y="360" fill="var(--teal)">gap (ToF)</text>
      <text x="12" y="492" fill="var(--red)">fork 15 (on ground)</text>
      <text x="12" y="525" fill="var(--ink)" font-size="14">Σ = 250 ✓</text>
    </g>
  </g>
  </svg>
</section>

</div>
</body>
</html>
